name: Generate Keystore & Secrets

# 🔑 Utilidad de firma (patrón PlantTrack/RiderTrack v2).
# Se ejecuta MANUALMENTE desde la pestaña Actions →
# "Generate Keystore & Secrets" → "Run workflow".
#
# Dos modos:
#   • RECUPERACIÓN (ya existe KEYSTORE_BASE64 en Secrets): decodifica el
#     keystore ACTUAL y muestra sus huellas SHA1/SHA256 + vigencia.
#     ⚠️ NO lo reemplaza — un keystore nuevo cambiaría la firma y la app
#     dejaría de instalarse encima de las versiones anteriores.
#   • GENERACIÓN (no hay secret): crea un keystore nuevo (RSA 2048,
#     validez ~27 años, alias trackstack) y muestra su base64 para copiar
#     a GitHub Secrets (KEYSTORE_BASE64).
#
# Las huellas SHA1/SHA256 se necesitan para registrar la app en Firebase
# (Google Sign-In) y en Google Cloud Console.

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Restore keystore from Secrets (or generate new)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "🔑 MODO RECUPERACIÓN — ya existe KEYSTORE_BASE64 en Secrets"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > trackstack.keystore
            echo "MODO=recuperado" >> $GITHUB_ENV
          else
            echo "🆕 MODO GENERACIÓN — no hay KEYSTORE_BASE64, creando keystore nuevo"
            keytool -genkeypair \
              -keystore trackstack.keystore \
              -alias trackstack \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass trackstack123 \
              -keypass trackstack123 \
              -dname "CN=TrackStack, OU=Dev, O=Track, L=Lima, S=Lima, C=PE"
            echo "MODO=generado" >> $GITHUB_ENV
          fi

      - name: Show fingerprints (SHA1 / SHA256)
        run: |
          echo "======================================================"
          echo "HUELLAS DEL KEYSTORE (para Firebase / Google Console):"
          echo "======================================================"
          keytool -list -v -keystore trackstack.keystore -alias trackstack -storepass trackstack123 | grep -E "SHA1:|SHA256:|Valid|until"
          echo "======================================================"

      - name: Show base64 (solo si es nuevo)
        if: env.MODO == 'generado'
        run: |
          echo "======================================================"
          echo "COPIÁ ESTE BASE64 al secret KEYSTORE_BASE64 del repo:"
          echo "(GitHub → Settings → Secrets and variables → Actions)"
          echo "======================================================"
          base64 -w 0 trackstack.keystore
          echo ""
          echo "======================================================"
          echo "⚠️ Guardalo también en un lugar seguro (no solo GitHub):"
          echo "   si lo perdés, la app no se podrá actualizar encima."
          echo "======================================================"
